<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bristol 8 km — Buildings, Terrain &amp; Landscape (web preview)</title>
<style>
:root{--bg:#eef1ef;--panel:rgba(255,255,255,.94);--ink:#1f2724;--muted:#5d6864;--line:#d5dcd8;--accent:#2f6b57;--warn:#9a3b2c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#c{position:fixed;inset:0;display:block}
/* left column: dock (panel controls and chips of minimised cards) above the layers/landmarks panel */
#left{position:fixed;left:14px;top:14px;bottom:14px;width:290px;display:flex;flex-direction:column;gap:8px;pointer-events:none}#left>*{pointer-events:auto}
#dock{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#dock button{background:var(--panel);box-shadow:0 1px 6px rgba(0,0,0,.08);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ui-toggle{font-weight:600}.chip::before{content:"\25B8\00a0";color:var(--muted)}
#chip-act{display:inline-flex;flex-direction:column;align-items:stretch;gap:3px;min-width:150px;font-variant-numeric:tabular-nums}#chip-act .bar{margin:0;height:3px}#chip-act.err{color:var(--warn);border-color:var(--warn)}
#chip-act::before{content:none}
#panel{flex:0 1 auto;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.cardhead .tools{display:flex;gap:4px;flex:none}
button.ico{width:24px;height:24px;padding:0;line-height:1;font-size:15px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1{font-size:19px;margin:0 0 2px;font-family:Georgia,serif;font-weight:600}.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0 12px}.stats b{font-size:17px;display:block}.stats span{color:var(--muted);font-size:11px}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;font-weight:600}
label{display:flex;gap:7px;align-items:center;margin:3px 0;cursor:pointer}.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.btns{display:flex;flex-wrap:wrap;gap:5px}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}
#info{position:fixed;right:14px;top:14px;width:320px;max-height:60%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;font-size:12px}#info-title{overflow-wrap:anywhere;padding-top:3px}
#info table{border-collapse:collapse;width:100%}#info td{border-top:1px solid #eef0ef;padding:3px 4px;vertical-align:top;overflow-wrap:anywhere}#info td:first-child{color:var(--muted);white-space:nowrap}
#foot{position:fixed;left:320px;bottom:8px;right:14px;color:var(--muted);font-size:11px;pointer-events:none;text-align:right}
#status{color:var(--muted);font-size:11px;margin-top:8px}
.note{color:var(--muted);font-size:11px;margin-top:8px}
#landmarks button.pri{font-weight:600;border-color:#7a8a76}
[hidden]{display:none!important}
/* progress bars: a determinate fill, or a moving stripe while the total is not known */
.bar{height:6px;border-radius:3px;background:#dfe5e1;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .15s linear}
.bar.ind i{width:35%;animation:ind 1.2s ease-in-out infinite}@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar.ind i{animation:none;width:100%;opacity:.45}.bar i{transition:none}}
#boot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#boot b{font-family:Georgia,serif;font-size:16px;font-weight:600}#boot-msg{margin-top:6px}#boot-sub{color:var(--muted);font-size:12px;margin-top:6px;min-height:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#boot.err #boot-msg{color:var(--warn)}#boot-retry{margin-top:8px}
#act{position:fixed;left:318px;right:348px;top:14px;margin-inline:auto;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px 9px 12px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}#act .cardhead{align-items:center}
#act-text{font-variant-numeric:tabular-nums}#act .bar{margin-top:6px;height:4px}#act.err #act-text{color:var(--warn)}#act-retry{margin-top:6px}
@media (max-width:980px){#act{left:14px;right:14px;top:auto;bottom:34px;max-width:none}}
@media (max-width:700px){#left{width:auto;right:14px;bottom:auto;max-height:52%}#info{left:14px;right:14px;width:auto;top:auto;bottom:92px;max-height:34%}#foot{display:none}#act{bottom:14px}}
#diagdl{position:fixed;right:12px;bottom:6px;font:11px system-ui;padding:2px 8px}#diag{position:fixed;right:12px;bottom:30px;width:400px;max-width:calc(100% - 24px);max-height:50%;overflow:auto;background:rgba(20,26,24,.88);color:#e8efe9;border-radius:8px;padding:6px 8px 8px 10px}#diag-text{margin:0;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#diag .cardhead{color:#b9c6be;font-size:11px;align-items:center}#diag button.ico{background:transparent;border-color:#5d6864;color:#e8efe9}
</style>
<script>/* Read-only diagnostics, captured from page start. Shown only with ?diag=1. Not the full browser console. */
window.__diag = { t0: performance.now(), errors: [], marks: {} };
addEventListener('error', e => __diag.errors.push({ t_ms: Math.round(performance.now()), type: 'error', msg: String(e.message || e), src: (e.filename || '') + ':' + (e.lineno || '') }));
addEventListener('unhandledrejection', e => __diag.errors.push({ t_ms: Math.round(performance.now()), type: 'unhandledrejection', msg: String(e.reason && (e.reason.stack || e.reason.message) || e.reason) }));
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="left">
  <div id="dock" role="toolbar" aria-label="Panel controls">
    <button id="ui-toggle" type="button" aria-pressed="false" aria-label="Hide all panels" title="Hide all panels to see the model (H)">Hide panels</button>
    <button id="chip-panel" class="chip" type="button" hidden aria-label="Show the layers and landmarks panel" title="Show the layers and landmarks panel">Layers &amp; landmarks</button>
    <button id="chip-info" class="chip" type="button" hidden aria-label="Show the feature record" title="Show the feature record"><span id="chip-info-text">Record</span></button>
    <button id="chip-act" class="chip" type="button" hidden aria-label="Show the loading panel" title="Show the loading panel"><span id="chip-act-text"></span><span class="bar"><i id="chip-act-fill"></i></span></button>
    <button id="chip-diag" class="chip" type="button" hidden aria-label="Show the diagnostics panel" title="Show the diagnostics panel">Diagnostics</button>
  </div>
  <div id="panel">
    <div class="cardhead"><h1>Bristol</h1><div class="tools"><button id="min-panel" class="ico" type="button" aria-label="Minimise the layers and landmarks panel" title="Minimise this panel">&#8211;</button></div></div>
    <div class="sub" id="sub">8 km × 8 km · centred on The Centre</div>
    <div class="stats" id="stats"></div>
    <h2>Layers</h2><div id="layers"></div>
    <h2>Views</h2><div class="btns" id="views"></div>
    <h2>Landmarks</h2><div class="btns" id="landmarks"></div>
    <div id="status"></div>
    <div class="note" id="note"></div>
  </div>
</div>
<div id="info" hidden>
  <div class="cardhead"><b id="info-title"></b><div class="tools"><button id="min-info" class="ico" type="button" aria-label="Minimise the feature record" title="Minimise this record">&#8211;</button><button id="close-info" class="ico" type="button" aria-label="Close the feature record" title="Close this record">&#215;</button></div></div>
  <div class="note" id="info-note"></div><table id="info-table"></table>
</div>
<div id="foot"></div>
<div id="act" role="status" aria-live="polite" hidden>
  <div class="cardhead"><div id="act-text"></div><div class="tools"><button id="min-act" class="ico" type="button" aria-label="Minimise the loading panel" title="Minimise the loading panel">&#8211;</button></div></div>
  <div class="bar"><i id="act-fill"></i></div><button id="act-retry" type="button" hidden>Retry the failed files</button>
</div>
<div id="diag" hidden><div class="cardhead"><span>Diagnostics</span><div class="tools"><button id="min-diag" class="ico" type="button" aria-label="Minimise the diagnostics panel" title="Minimise diagnostics">&#8211;</button></div></div><pre id="diag-text"></pre></div>
<!-- Start-up panel: in the page before any script runs, so something is visible while the viewer code itself downloads. -->
<div id="boot" role="status" aria-live="polite"><b>Bristol 8 km preview</b><div id="boot-msg">Starting the viewer…</div><div class="bar ind" id="boot-bar"><i id="boot-fill"></i></div><div id="boot-sub"></div><button id="boot-retry" hidden>Retry</button></div>
<noscript><p style="position:fixed;left:16px;bottom:40px">This page needs JavaScript and WebGL to show the 3D model.</p></noscript>
<script>
// Until the viewer module runs, only this small script can report anything.
setTimeout(function () { if (!window.__viewerStarted && !document.getElementById('boot').classList.contains('err')) document.getElementById('boot-sub').textContent = 'The viewer code (about 0.9 MB) has not started yet. On a slow connection this can take a while.'; }, 6000);
function __viewerCodeFailed() { var b = document.getElementById('boot'); b.classList.add('err'); document.getElementById('boot-bar').hidden = true;
  document.getElementById('boot-msg').textContent = 'The viewer code did not load.'; document.getElementById('boot-sub').textContent = 'Check the connection, then retry.';
  var r = document.getElementById('boot-retry'); r.hidden = false; r.onclick = function () { location.reload(); }; }
</script>
<script type="module" src="./viewer.js?v=panels001-20261110" onerror="__viewerCodeFailed()"></script>
</body>
